<!DOCTYPE html>
<html lang="en">
<head>
    <title>Pengujian Form 1</title>
</head>
<body>

<form action="form1.html" method="post">

    <p>Silahkan isi berikut:</p>

    Nama:
    <input type="text" name="nama"
    value="Sholeh"><br>

    Jenis Kelamin:
    <input type="radio" name="jenkel"
    value="laki-laki">Laki-laki

    <input type="radio" name="jenkel"
    value="perempuan" checked>Perempuan
    <br>

    Username:
    <input type="text" name="username"
    value="Sholeh"><br>

    Password:
    <input type="password" name="password"
    value="654321"><br>

    Course yang diikuti:
    <input type="checkbox" name="html">HTML & CSS

    <input type="checkbox" name="javascript">Javascript

    <input type="checkbox" name="react" checked>React JS

    <input type="checkbox" name="node" checked>Node JS

    <br><br>

    <button type="submit" name="submit"
    value="simpan">Simpan</button>

</form>

</body>
</html>
